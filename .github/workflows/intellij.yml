name: Publish IntelliJ Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "intellij-v*"

permissions:
  contents: read

concurrency:
  group: intellij-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    environment:
      name: intellij-marketplace
    defaults:
      run:
        working-directory: intellij
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: intellij
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          version="$(grep -oP '^version = "\K[^"]+' build.gradle.kts)"
          expected="intellij-v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Expected tag ${expected}, got ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Run tests
        run: ./gradlew test
      - name: Verify plugin
        run: ./gradlew verifyPlugin
      - name: Publish plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin
      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: mos-intellij-marketplace
          path: intellij/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30
