name: IntelliJ Plugin CI

on:
  pull_request:
    paths:
      - ".github/workflows/intellij-ci.yml"
      - "intellij/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/intellij-ci.yml"
      - "intellij/**"

permissions:
  contents: read

concurrency:
  group: intellij-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intellij
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: intellij
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run tests
        run: ./gradlew test
      - name: Package plugin
        run: ./gradlew buildPlugin
      - name: Verify plugin
        run: ./gradlew verifyPlugin
      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: mos-intellij
          path: intellij/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
