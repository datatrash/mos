[package]
name = "mos"
version = "0.8.4"
authors = ["Roy Jacobs <roy.jacobs@gmail.com>"]
edition = "2024"
repository = "https://github.com/datatrash/mos"
license = "MIT"
keywords = ["retro", "6502", "assembler"]
description = "A modern 6502 assembler"
publish = false

[package.metadata.release]
publish = false
tag-name = "{{version}}"

[package.metadata.dist]
dist = true

[dependencies]
ansi_term = "0.12"
anyhow = "1"
byteorder = "1.5"
argh = "0.1"
codespan-reporting = "0.13"
crossbeam-channel = "0.5"
dissimilar = "1"
emulator_6502 = { version = "1.1.0", features = ["implementation_transparency"] }
fs-err = "3"
itertools = "0.15"
log = { version = "0.4", features = ["max_level_trace", "release_max_level_info"] }
loggerv = "0.7"
lsp-types = "0.97"
lsp-server = "0.10"
mos-core = { path = "../mos-core" }
once_cell = "1.21"
path-absolutize = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
toml = "1.1"
url = "2.5"

[dev-dependencies]
mos-testing = { path = "../mos-testing" }
tempfile = "3"
